<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>Iso Warrior — 3D Isometric Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.17"></script>
<style type="text/tailwindcss">


html,
body,
#root {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #0b1020;
}

body {
  font-family: "Outfit", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.font-mono2 {
  font-family: "JetBrains Mono", ui-monospace, monospace;
}

canvas {
  display: block;
  outline: none;
}

/* ---------- kbd chip ---------- */
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.65rem;
  height: 1.65rem;
  padding: 0 0.45rem;
  border-radius: 0.5rem;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #e7ecf5;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-bottom-width: 2.5px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* ---------- glass panel ---------- */
.glass {
  background: linear-gradient(160deg, rgba(15, 20, 38, 0.72), rgba(10, 13, 26, 0.62));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ---------- vignette + grain overlays ---------- */
.fx-vignette {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(8, 10, 22, 0.38) 100%);
}

.fx-grain {
  pointer-events: none;
  position: absolute;
  inset: 0;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- animations ---------- */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(26px) scale(0.98);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes floatY {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@keyframes shine {
  0% {
    transform: translateX(-160%) skewX(-18deg);
  }
  100% {
    transform: translateX(260%) skewX(-18deg);
  }
}

/* Counter "pop" — scales only. Starting opacity stays at 1 so that
   rapidly-changing values (money during a sale) never flash blank. */
@keyframes popIn {
  0% {
    transform: scale(0.62);
    opacity: 1;
  }
  60% {
    transform: scale(1.12);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes pulseGlow {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.35), 0 10px 40px rgba(251, 146, 60, 0.35);
  }
  50% {
    box-shadow: 0 0 0 10px rgba(251, 191, 36, 0), 0 10px 52px rgba(251, 146, 60, 0.55);
  }
}

@keyframes toastIn {
  0% {
    opacity: 0;
    transform: translateY(-18px) scale(0.92);
  }
  12% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  86% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-10px) scale(0.97);
  }
}

.anim-fade-up {
  animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.anim-float {
  animation: floatY 5s ease-in-out infinite;
}

.anim-pop {
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.anim-toast {
  animation: toastIn 2.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* ---------- HUD rail scrollbars, drawn in the game's palette ---------- */
.rail {
  scrollbar-width: thin;
  scrollbar-color: rgba(251, 191, 36, 0.55) rgba(255, 255, 255, 0.06);
}

.rail::-webkit-scrollbar {
  width: 6px;
}

.rail::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 999px;
}

.rail::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #fbbf24, #ea580c);
  border-radius: 999px;
}

.rail::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #fcd34d, #f97316);
}

.rail-blue::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #60a5fa, #2563eb);
}

.rail-blue::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #93c5fd, #3b82f6);
}

.rail-blue {
  scrollbar-color: rgba(96, 165, 250, 0.55) rgba(255, 255, 255, 0.06);
}

.btn-shine {
  position: relative;
  overflow: hidden;
}

.btn-shine::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: shine 2.8s ease-in-out infinite;
}

</style>

</script>
